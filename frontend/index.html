<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairLens — See the Fix</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo-repairlens.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css?v=11">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="app-shell">

        <!-- TOP HEADER -->
        <header class="top-bar">
            <a href="/" class="brand-row">
                <img src="/static/assets/logo-repairlens.svg" alt="RepairLens" class="brand-logo-img">
                <span class="brand-title">RepairLens</span>
            </a>
            <div class="top-actions">
                <div id="google-signin-btn"></div>
                <div id="google-user-info" style="display:none;align-items:center;gap:6px;"></div>
                <button type="button" class="lang-switch" id="btn-lang-switch" onclick="basculerLangue()">
                    EN | FR
                </button>
                <a href="/static/history.html?tab=profile" class="avatar-btn" id="user-avatar-badge" title="Profile">
                    RL
                </a>
            </div>
        </header>
            <section class="hero-card">
                <div class="hero-ar-bg">
                    <div class="hero-ar-circle">
                        <div class="hero-ar-dot"></div>
                    </div>
                </div>

                <h1 class="hero-heading">
                    <span data-i18n="hero_1">Understand.</span><br>
                    <span data-i18n="hero_2">Diagnose.</span>
                    <span class="cyan-word" data-i18n="hero_3">Repair.</span>
                </h1>

                <p class="hero-desc" data-i18n="hero_desc">
                    Your AI assistant for understanding and repairing the devices around you.
                </p>

                <a href="/static/camera.html" class="btn-cyan">
                    <svg style="width:18px;height:18px;vertical-align:middle;fill:currentColor;margin-right:6px;" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                    <span data-i18n="btn_start_repair">Start a repair</span>
                </a>

            </section>

    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="/" class="nav-tab active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span data-i18n="nav_home">HOME</span>
            </a>
            <a href="/static/camera.html" class="nav-fab-plus" title="New Inspection">+</a>
            <a href="/static/history.html" class="nav-tab">
                <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span data-i18n="nav_history">HISTORY</span>
            </a>
            <a href="/static/history.html?tab=profile" class="nav-tab">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span data-i18n="nav_profile">PROFILE</span>
            </a>
        </div>
    </nav>

    <script src="/static/js/app.js?v=23"></script>
</body>
</html>
