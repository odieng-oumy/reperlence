<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairLens — See the Fix</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo-repairlens.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css?v=7">
    <link rel="stylesheet" href="/static/css/history.css?v=7">
</head>
<body>

    <div class="app-shell">

        <!-- =========================================================
             VUE 1 : REPAIR HISTORY
             ========================================================= -->
        <section id="view-history">
            <div class="history-header">
                <h1 class="history-main-title" data-i18n="repair_history_title">Repair History</h1>
                <div class="top-actions">
                    <button type="button" class="lang-switch" id="btn-lang-switch" onclick="basculerLangue()">EN | FR</button>
                    <button type="button" class="icon-circle-btn" onclick="afficherOngletHistory('profile')" title="Profile Settings"><svg style="width:16px;height:16px;vertical-align:middle;fill:currentColor;" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
                </div>
            </div>

            <!-- Barre de recherche -->
            <div class="search-box">
                <svg style="width:16px;height:16px;vertical-align:middle;fill:var(--text-muted);" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="input-search-history"
                       data-i18n-placeholder="search_placeholder"
                       placeholder="Search your repairs..."
                       oninput="filtrerEtAfficherHistorique()">
            </div>

            <!-- Filtres : All Sessions / In Progress / Completed -->
            <div class="filter-pills-row">
                <button type="button" class="filter-pill active" id="pill-all" onclick="changerFiltreStatut('tous')" data-i18n="filter_all">
                    All Sessions
                </button>
                <button type="button" class="filter-pill" id="pill-progress" onclick="changerFiltreStatut('en_cours')" data-i18n="filter_progress">
                    In Progress
                </button>
                <button type="button" class="filter-pill" id="pill-completed" onclick="changerFiltreStatut('resolu')" data-i18n="filter_completed">
                    Completed
                </button>
            </div>

            <!-- Liste des sessions personnelles depuis PostgreSQL -->
            <div id="history-sessions-list"></div>
        </section>

        <!-- =========================================================
             VUE 2 : PROFILE UTILISATEUR PERSONNEL
             ========================================================= -->
        <section id="view-profile" style="display:none;">
            <div class="history-header">
                <h1 class="history-main-title" data-i18n="profile_title">Technician Profile</h1>
                <button type="button" class="icon-circle-btn" onclick="afficherOngletHistory('history')"><svg style="width:14px;height:14px;vertical-align:middle;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
            </div>

            <div class="profile-card">
                <div class="profile-avatar-large" id="profile-big-initials">RL</div>
                <h2 id="profile-display-name" style="font-size:20px; font-weight:800; margin-bottom:4px;">Technician</h2>
                <p id="profile-uid-text" style="font-size:11px; color:var(--text-muted); margin-bottom:16px;"></p>

                <div class="stats-grid-3">
                    <div class="stat-mini-box">
                        <div class="stat-mini-num" id="stat-total-count">0</div>
                        <div class="stat-mini-label">Total</div>
                    </div>
                    <div class="stat-mini-box">
                        <div class="stat-mini-num" id="stat-progress-count">0</div>
                        <div class="stat-mini-label" data-i18n="filter_progress">In Progress</div>
                    </div>
                    <div class="stat-mini-box">
                        <div class="stat-mini-num" id="stat-completed-count">0</div>
                        <div class="stat-mini-label" data-i18n="filter_completed">Completed</div>
                    </div>
                </div>

                <div style="text-align:left; margin-top:16px;">
                    <label style="font-size:12px; font-weight:700; color:var(--text-gray); display:block; margin-bottom:6px;">
                        YOUR NAME / PSEUDO
                    </label>
                    <input type="text" id="input-profile-name" class="repair-card"
                           style="width:100%; padding:12px 14px; color:var(--text-white); cursor:text; margin-bottom:12px;"
                           placeholder="Ex: Oumy - Technician">
                    <button type="button" class="btn-cyan" onclick="sauvegarderProfilNom()">
                        Save Profile
                    </button>
                </div>
            </div>
        </section>

    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="/" class="nav-tab">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span data-i18n="nav_home">HOME</span>
            </a>
            <a href="/static/camera.html?mode=explore" class="nav-tab">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
                <span data-i18n="nav_explore">EXPLORE</span>
            </a>
            <a href="/static/camera.html" class="nav-fab-plus" title="New Inspection">+</a>
            <button type="button" class="nav-tab active" id="nav-tab-history" onclick="afficherOngletHistory('history')">
                <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span data-i18n="nav_history">HISTORY</span>
            </button>
            <button type="button" class="nav-tab" id="nav-tab-profile" onclick="afficherOngletHistory('profile')">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span data-i18n="nav_profile">PROFILE</span>
            </button>
        </div>
    </nav>

    <script src="/static/js/app.js?v=6"></script>
    <script src="/static/js/history.js?v=6"></script>
</body>
</html>
