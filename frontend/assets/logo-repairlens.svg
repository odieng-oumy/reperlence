<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0080ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="240" r="200" fill="#0b131e"/>
  <circle cx="256" cy="240" r="200" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.5"/>

  <!-- Outer eye shape -->
  <path d="M56 240 Q156 120 256 120 Q356 120 456 240 Q356 360 256 360 Q156 360 56 240Z"
        fill="none" stroke="url(#glow)" stroke-width="4" filter="url(#neon)" opacity="0.9"/>

  <!-- Inner eye fill (subtle) -->
  <path d="M56 240 Q156 120 256 120 Q356 120 456 240 Q356 360 256 360 Q156 360 56 240Z"
        fill="#00f0ff" opacity="0.04"/>

  <!-- Iris circle -->
  <circle cx="256" cy="240" r="85" fill="none" stroke="url(#glow)" stroke-width="3" filter="url(#neon)"/>
  <circle cx="256" cy="240" r="85" fill="#00f0ff" opacity="0.06"/>

  <!-- Gear/cog in the iris (mechanical eye) -->
  <g transform="translate(256,240)" fill="none" stroke="url(#glow2)" stroke-width="3.5" filter="url(#neon)">
    <!-- Gear teeth (12 teeth) -->
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(0)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(30)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(60)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(90)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(120)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(150)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(180)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(210)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(240)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(270)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(300)"/>
    <path d="M0,-55 L5,-55 L7,-48 L-7,-48 L-5,-55Z" transform="rotate(330)"/>
    <!-- Gear outer ring -->
    <circle r="48" stroke-width="5"/>
    <!-- Gear inner ring -->
    <circle r="22" stroke-width="3"/>
  </g>

  <!-- Pupil (lens flare) -->
  <circle cx="256" cy="240" r="14" fill="url(#glow)" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="248" cy="232" r="5" fill="#ffffff" opacity="0.8"/>

  <!-- Scan lines (AI scanning effect) -->
  <line x1="100" y1="200" x2="180" y2="200" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="220" x2="170" y2="220" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
  <line x1="332" y1="260" x2="412" y2="260" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="342" y1="280" x2="412" y2="280" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>

  <!-- Corner brackets (targeting/scan UI) -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.5">
    <path d="M96 160 L96 140 L116 140"/>
    <path d="M416 160 L416 140 L396 140"/>
    <path d="M96 320 L96 340 L116 340"/>
    <path d="M416 320 L416 340 L396 340"/>
  </g>

  <!-- Text: RepairLens -->
  <text x="256" y="445" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="3">
    <tspan fill="#ffffff">Repair</tspan><tspan fill="#00f0ff">Lens</tspan>
  </text>

  <!-- Tagline -->
  <text x="256" y="478" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="16" fill="#00f0ff" opacity="0.6" letter-spacing="5">
    AI REPAIR VISION
  </text>
</svg>
