services:
  - type: web
    name: repairlens
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: repairlens-db
          property: connectionString
      - key: META_API_KEY
        sync: false
      - key: META_API_URL
        value: https://api.meta.ai/v1
      - key: META_VISION_MODEL
        value: muse-spark-1.3
      - key: META_TEXT_MODEL
        value: muse-spark-1.3
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: repairlens-db
    plan: free
    databaseName: repairlens
